name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS app + CLI
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: swift --version
      - name: Test
        run: swift test
      - name: Build app (ad-hoc signed)
        run: SIGN_IDENTITY=- ./scripts/build-app.sh
      - name: Smoke-test CLI
        run: build/RasterNest.app/Contents/Helpers/rnest --version
      - name: Zip app
        run: ditto -c -k --keepParent build/RasterNest.app build/RasterNest-ci.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RasterNest-macos
          path: build/RasterNest-ci.zip

  linux:
    name: Linux CLI
    runs-on: ubuntu-24.04
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Build CLI
        run: swift build --product rnest
      - name: Test
        run: swift test
      - name: Smoke-test CLI
        run: |
          .build/debug/rnest --version
          .build/debug/rnest --help

  windows:
    name: Windows app + CLI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: |
          dotnet test windows/tests/RasterNest.Core.Tests -c Release
          dotnet test windows/tests/RasterNest.Render.Tests -c Release
      - name: Build app
        run: dotnet build windows/src/RasterNest.App -c Release -p:Platform=x64
      - name: Smoke-test CLI
        run: |
          dotnet build windows/src/rnest -c Release
          dotnet run --project windows/src/rnest -c Release --no-build -- --version
          dotnet run --project windows/src/rnest -c Release --no-build -- export Tests/Fixtures/mac-sample.rasternest -o "$env:RUNNER_TEMP\sample.png"
